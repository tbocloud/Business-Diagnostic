# CodeRabbit: review the source code, not the generated website build.
# Root-level patterns only — api/admin/**, web/app/admin/** etc. are still reviewed.
reviews:
  path_filters:
    # Website build output — generated by `cd web && npm run deploy`, never edited by hand
    - "!_next/**"
    - "!admin/**"
    - "!check/**"
    - "!results/**"
    - "!404/**"
    - "!404.html"
    - "!index.html"
    - "!index.txt"
    - "!icon.svg"
    # Lockfile, boilerplate config and repo metadata
    - "!web/package-lock.json"
    - "!web/tsconfig.json"
    - "!web/postcss.config.js"
    - "!web/.eslintrc.json"
    - "!web/.gitignore"
    - "!web/tailwind.config.ts"
    - "!.env.example"
    - "!.gitattributes"
    # Old GPT endpoints (deleted — nothing left to review)
    - "!api/analyze.php"
    - "!api/get-result.php"
    - "!api/save-phone.php"
